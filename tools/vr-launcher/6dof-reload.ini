; 修改后，下次启动游戏生效；正在进行的换弹不受修改影响。
; vr = 使用下面的秒数；original = 原版窗口；off = 关闭完美奖励。
; vr 模式下，枪械换弹条和完美奖励共用这些时间，单位为秒。
; tactical：开始时仍有余弹，插匣闭合为终点；empty：空仓，机构上膛并回位为终点。
; 超时按普通换弹完成，无原版失败／卡壳惩罚；计时结束不会自动装弹或解锁射击。
[Lancer]
perfect_reload = vr
tactical_seconds = 4.0
empty_seconds = 4.0

; Snub、Hammerburst 默认继承上面的设置。需要单独调整时可加同名节覆盖。
; [Snub]
; tactical_seconds = 4.0
; empty_seconds = 4.0
; [Hammerburst]
; tactical_seconds = 4.0
; empty_seconds = 4.0
